name: Bug report
description: Report a defect that affects users or developers.
title: 'bug: '
labels: ['type-bug']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part is affected?
      options:
        - capture
        - boot and restore
        - react
        - vite plugin
        - build helper
        - docs or demo
        - other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's wrong?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Browser, OS, lastframe, framework, and bundler versions (e.g., Chrome 141, macOS 26, lastframe 0.1.0, React 19, Vite 8)
