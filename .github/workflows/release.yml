name: Release

on:
  workflow_run:
    workflows: ['Pull Request']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  route:
    name: Route release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.route.outputs.publish }}
    steps:
      - name: Identify the merged pull request
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pull_request="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | reverse | .[0] // {}')"
          head_ref="$(jq -r '.head.ref // ""' <<< "$pull_request")"

          if [[ "$head_ref" == "changeset-release/main" ]]; then
            pull_request_number="$(jq -r '.number' <<< "$pull_request")"
            package_manifests="$(gh api --paginate --slurp \
              --header 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/pulls/${pull_request_number}/files?per_page=100" \
              | jq -c '[.[][] | select(.status != "removed") | .filename | select(test("^package\\.json$"))]')"

            if ! jq -e 'length > 0' <<< "$package_manifests" > /dev/null; then
              echo 'No package manifests changed in the release pull request' >&2
              exit 1
            fi

            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  version-pr:
    name: Update release pull request
    needs: route
    if: needs.route.outputs.publish != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-pnpm
        with:
          ignore-scripts: 'true'

      - name: Create or update release pull request
        uses: changesets/action@c48e67d110a68bc90ccf1098e9646092baacaa87
        with:
          version: pnpm run release:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Stage package
    needs: route
    if: needs.route.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Staged publishing needs npm 11.15.0 or later; pin the CLI instead of
      # relying on the version bundled with Node.
      - name: Install npm with staged publishing
        run: npm install --global npm@11.21.0

      - name: Verify npm version
        run: npm --version

      - name: Build package
        run: pnpm run build

      # The trusted publisher only allows `npm stage publish`. The staged version
      # goes live after a maintainer approves it on npmjs.com with 2FA; then run
      # the "GitHub Release" workflow to tag it.
      - name: Stage package for approval
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          if npm view "${name}@${version}" version > /dev/null 2>&1; then
            echo "${name}@${version} is already on npm; nothing to stage." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npm stage publish --access public --ignore-scripts

          {
            echo "### ${name}@${version} is staged"
            echo
            echo "1. Approve it in the Staged Packages tab on npmjs.com (2FA required)."
            echo "2. Run the **GitHub Release** workflow on main (leave release_sha empty)."
          } >> "$GITHUB_STEP_SUMMARY"
