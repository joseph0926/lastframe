allowBuilds:
  esbuild: true
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
    # braces <=3.0.3 has no patched release yet. It is reached only through
    # micromatch in dev tooling (changesets, lint-staged, vite), which matches
    # glob patterns written in this repository, never untrusted input.
    - GHSA-vfj7-8cjw-p6xm
minimumReleaseAgeExclude:
  - minimatch@11.0.4
overrides:
  # GHSA-g3hv-75wg-m249: update v10's optimizationLevel preprocessing.
  # v3 lacks that code path and keeps the callable CommonJS API used by ESLint 9.
  'minimatch@>=10.0.0 <11.0.1': 11.0.4
  'react': '^19.2.4'
  'react-dom': '^19.2.4'
  '@types/react': '^19.2.10'
  '@types/react-dom': '^19.2.3'
  'postcss': '^8.5.23'
  'nanoid@<3.3.18': '^3.3.18'
  'source-map-js@<1.2.2': '^1.2.2'
  'brace-expansion@<1.1.21': '^1.1.21'
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'
  'undici@>=7.0.0 <7.30.1': '^7.30.1'
